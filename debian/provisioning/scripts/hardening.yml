#Sources:
# https://www.debian.org/doc/manuals/securing-debian-manual/index.en.html
# https://github.com/geerlingguy/ansible-for-devops/blob/master/security/main.yml
# https://github.com/ovh/debian-cis
---
# User account configuration.
- name: Add a deployment user.
  user:
    name: "{{ username }}"
    state: present
    createhome: yes

- name: Add SSH authorized key for user
  authorized_key:
    user: "{{ username }}"
    state: present
    exclusive: true
    key: "{{ sshPublicKey }}"

# Disable root login and use `sudo`.
- name: Add sudo rights for deployment user.
  lineinfile:
    dest: /etc/sudoers
    regexp: "^{{ username }}"
    line: "{{ username }} ALL=(ALL) NOPASSWD: ALL"
    state: present
    validate: 'visudo -cf %s'

# Use secure and encrypted communication.
- name: Update SSH configuration to be more secure.
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: 'sshd -t -f %s'
  with_items:
    - regexp: "^PasswordAuthentication"
      line: "PasswordAuthentication no"
    - regexp: "^PermitRootLogin"
      line: "PermitRootLogin no"
    - regexp: "^Port"
      line: "Port 2849"
  notify: restart ssh

# Remove unused software, open only required ports.
- name: Remove unused packages.
  package:
    name:
      - nano
      - sendmail
    state: absent

# Automating updates for Debian systems.
- name: Install unattended upgrades package.
  apt:
    name: unattended-upgrades
    state: present
  when: ansible_os_family == 'Debian'

- name: Copy unattended-upgrades configuration files in place.
  template:
    src: "../templates/{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: 0644
  with_items:
    - 20auto-upgrades
    - 50unattended-upgrades

# Configuring a firewall with `firewalld` on RHEL.
- name: Install firewalld
  apt:
    name: firewalld
    state: present

- name: Ensure firewalld is running.
  service:
    name: firewalld
    state: started

- name: Configure open ports with firewalld.
  firewalld:
    state: "{{ item.state }}"
    port: "{{ item.port }}"
    zone: public
    immediate: yes
    permanent: yes
  with_items:
    - { state: 'enabled', port: '2849/tcp' }

# Monitor logins and block suspect IP addresses.
- name: Install fail2ban (Debian).
  apt:
    name: fail2ban
    state: present
  when: ansible_os_family == 'Debian'

- name: Ensure fail2ban is running and enabled on boot.
  service:
    name: fail2ban
    state: started
    enabled: yes

# Use SELinux (Security-Enhanced Linux).
- name: Install Python SELinux library.
  apt:
    name: python3-selinux
    state: present
- name: Install default SELinux policy
  apt:
    name: selinux-policy-default
    state: present
- name: Ensure SELinux is enabled
  selinux:
    policy: default
    state: enforcing

- name: Install SELinux utilities
  apt:
    name: policycoreutils-python-utils
    state: present
- name: Allow sshd to listen on tcp port 2849.
  seport:
    ports: 2849
    proto: tcp
    setype: ssh_port_t
    ignore_selinux_state: true
    state: present
